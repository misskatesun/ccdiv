<body>

<div class="container">
    <!-- 輸入面板 -->
    <div class="panel">
        <h2>象棋卜卦命盤解讀</h2>
        
        <div class="form-group">
            <label for="interpretDate">解讀日期：</label>
            <input type="date" id="interpretDate">
        </div>

        <div class="form-group">
            <label for="clientName">個案姓名：</label>
            <input type="text" id="clientName" placeholder="請輸入個案姓名" oninput="updatePageTitle()">
        </div>
        
        <div class="form-group">
            <label for="clientBirth">個案出生年月日：</label>
            <input type="date" id="clientBirth" value="1990-01-01" max="9999-12-31">
        </div>

        <div class="form-group">
            <label for="readerName">解讀者：</label>
            <input type="text" id="readerName" value="凱特" placeholder="請輸入解讀者姓名">
        </div>

        <div id="checkboxContainer">
            <!-- JavaScript 會動態生成勾選項 -->
        </div>

        <button class="btn-main" style="margin-top:20px;" onclick="generateReport('all')">一鍵生成解讀報告</button>
    </div>

    <!-- 輸出與預覽面板 -->
    <div class="panel">
        <div class="report-preview-wrapper">
            <div id="reportOutput" class="report-preview">
                請在左側輸入資料與勾選項目，並點擊「一鍵生成解讀報告」。
            </div>
        </div>

        <!-- 功能按鈕卡片 1：完整報告操作 -->
        <div class="action-card">
            <div class="action-card-title">📜 完整報告操作</div>
            <div class="btn-grid-2">
                <button class="btn-main btn-copy" onclick="copyReport()">📋 複製內容 (LINE/文字)</button>
                <button class="btn-main btn-print" onclick="printMode('all')">🖨️ 另存 PDF / 列印</button>
            </div>
        </div>

        <!-- 功能按鈕卡片 2：單獨分類生成與下載 -->
        <div class="action-card">
            <div class="action-card-title">🧹 分類單獨生成與下載</div>
            <div class="btn-grid-2" style="margin-bottom: 8px;">
                <button class="btn-main btn-outline btn-outline-clean" onclick="generateReport('clean')">預覽【清理資料】</button>
                <button class="btn-main btn-clean-bg" onclick="printMode('clean')">📄 下載【清理】PDF</button>
            </div>
            <div class="btn-grid-2" style="margin-bottom: 8px;">
                <button class="btn-main btn-outline btn-outline-download" onclick="generateReport('download')">預覽【下載資料】</button>
                <button class="btn-main btn-download-bg" onclick="printMode('download')">📄 下載【下載】PDF</button>
            </div>
            <button class="btn-main btn-outline" style="margin-top: 4px;" onclick="generateReport('all')">🔍 預覽【完整報告】</button>
        </div>
    </div>
</div>

<script>
// 設定今天的預設日期
document.getElementById('interpretDate').valueAsDate = new Date();

// 更新網頁 Title 以利列印或另存 PDF 檔名正確
function updatePageTitle() {
    const name = document.getElementById('clientName').value.trim() || "個案";
    document.title = `象棋卜卦命盤解讀 _ ${name}`;
}

// 資料庫：包含判讀與對應的清理/下載文字
const optionsData = [
    {
        categoryIndex: 0,
        category: "一、 大腦小我慣性資料",
        items: [
            { id: "mind_1", label: "想控制、對人事物有既定想法（將帥士車）", clean: "想控制、對人事物境有既定想法", download: "我知道如何放下小我、感到順流平靜、全然交托、接納外境人事物、讓他們如其所是" },
            { id: "mind_2", label: "被動、情緒起伏大（象）", clean: "懶懶被動、情緒起伏大", download: "我知道如何感到積極熱情、順流平靜" },
            { id: "mind_3", label: "意念靜不下來、濫好人（馬）", clean: "意念靜不下來、很想有所作為、濫好人", download: "我是被支持的、順流平靜、接納自己、讓自己如其所是、有界線" },
            { id: "mind_4", label: "恐懼擔憂、急於改變（炮）", clean: "恐懼擔憂、很想有所作為", download: "我是被支持的、我是安全的、我是平安的、順流平靜、接納自己、讓自己如其所是" },
            { id: "mind_5", label: "思慮過多、自我消耗（兵卒）", clean: "思慮過多、自我消耗", download: "我知道如何感到順流平靜、接納自己、讓自己如其所是" }
        ]
    },
    {
        categoryIndex: 1,
        category: "二、 運勢資料",
        items: [
            { id: "luck_1", label: "阻礙發展（犯小人）", clean: "被人事物境阻礙想要的發展", download: "我知道如何感到順流平靜、接納外境人事物、讓他們如其所是、人人皆是我的貴人" },
            { id: "luck_2", label: "辛苦無成（付出大於收穫）", clean: "付出大於收穫、總是要很辛苦", download: "我值得豐盛、我值得獲得我想要的、輕鬆就能豐盛、我知道有餘裕的感覺是什麼" },
            { id: "luck_3", label: "糾紛與官司（法律官司）", clean: "法律官司、糾紛、名譽受損", download: "我知道如何感到順流平靜、接納外境人事物、讓他們如其所是" },
            { id: "luck_4", label: "重來與努力白費（通吃/被通吃）", clean: "重新來過、努力白費、總是要很辛苦", download: "我值得豐盛、我值得獲得我想要的、輕鬆就能豐盛、我知道有餘裕的感覺是什麼" },
            { id: "luck_5", label: "事與願違（全紅全黑/陰陽不協調）", clean: "事與願違", download: "我知道如何感到順流平靜、接納自己、讓自己如其所是、我值得一切的美好" },
            { id: "luck_6", label: "價值觀不同、格格不入（分離格）", clean: "與人格格不入、價值觀不同、分隔兩地", download: "我知道如何感到順流平靜、接納外境人事物、讓他們如其所是、人人皆是我的貴人、我值得和志同道合的靈魂家人在一起" },
            { id: "luck_7", label: "十年運破財（被吃較多）", clean: "破財", download: "我是豐盛的源頭、我值得豐盛、我知道有餘裕的感覺是什麼、擁有財富是安全的" }
        ]
    },
    {
        categoryIndex: 2,
        category: "三、 學習、情感與事業資料",
        items: [
            { id: "les_1", label: "難學以致用（學習格 馬/炮在中間）", clean: "學習上較難學以致用", download: "我學習是輕鬆愉快的" },
            { id: "les_2", label: "主觀質疑、難吸收（學習格 將帥）", clean: "學習時大腦容易以主觀想法質疑老師、教材、難以吸收", download: "我知道如何放下小我、感到順流平靜、全然交托、全然信任宇宙的安排" },

// 動態繪製勾選項
function renderCheckboxes() {
    const container = document.getElementById('checkboxContainer');
    let html = '';

    optionsData.forEach((cat, idx) => {
        html += `
            <div class="category-header">
                <span class="category-title">${cat.category}</span>
                <div class="btn-select-group">
                    <button type="button" class="btn-mini" onclick="toggleCategory(${idx}, true)">全選</button>
                    <button type="button" class="btn-mini" onclick="toggleCategory(${idx}, false)">取消全選</button>
                </div>
            </div>
            <div class="checkbox-group">
        `;
        cat.items.forEach(item => {
            html += `
                <label class="checkbox-item">
                    <input type="checkbox" id="${item.id}" value="${item.id}">
                    <span>${item.label}</span>
                </label>
            `;
        });
        html += `</div>`;
    });

    container.innerHTML = html;
}

// 切換特定分區全選/取消全選
function toggleCategory(categoryIndex, selectAll) {
    const category = optionsData[categoryIndex];
    if (!category) return;
    category.items.forEach(item => {
        const cb = document.getElementById(item.id);
        if (cb) cb.checked = selectAll;
    });
}

// 智慧解析與格式化複製內容（自動插入乾淨換行）
function copyReport() {
    const reportNode = document.getElementById('reportOutput');
    if (!reportNode) return;

    let textLines = [];

    // 1. 標題與元數據區塊
    const headerBox = reportNode.querySelector('.report-header-box');
    if (headerBox) {
        const title = headerBox.querySelector('h2');
        if (title) textLines.push(`【${title.innerText.trim()}】\n`);

        const metas = headerBox.querySelectorAll('.report-meta span');
        metas.forEach(m => textLines.push(m.innerText.trim()));
        textLines.push(''); // 空行分隔
    }

    // 2. 各分類區塊
    const sections = reportNode.querySelectorAll('.report-section');
    sections.forEach(sec => {
        const secTitle = sec.querySelector('.section-title-bar');
        if (secTitle) {
            textLines.push(`----------------------------------------`);
            textLines.push(`📌 ${secTitle.innerText.trim()}`);
            textLines.push(`----------------------------------------`);
        }

        const cards = sec.querySelectorAll('.item-card');
        cards.forEach(card => {
            const cleanLabel = card.querySelector('.label-clean');
            const cleanText = card.querySelector('.text-clean');
            const downloadLabel = card.querySelector('.label-download');
            const downloadText = card.querySelector('.text-download');

            if (cleanLabel && cleanText) {
                textLines.push(`${cleanLabel.innerText.trim()}`);
                textLines.push(`${cleanText.innerText.trim()}`);
            }
            if (downloadLabel && downloadText) {
                textLines.push(`${downloadLabel.innerText.trim()}`);
                textLines.push(`${downloadText.innerText.trim()}`);
            }
            textLines.push(''); // 卡片間空行
        });
    });

    // 3. 方法區塊
    const methodBoxes = reportNode.querySelectorAll('.method-box');
    methodBoxes.forEach(box => {
        const boxTitle = box.querySelector('h3');
        if (boxTitle) {
            textLines.push(`----------------------------------------`);
            textLines.push(boxTitle.innerText.trim());
            textLines.push(`----------------------------------------`);
        }

        const mSections = box.querySelectorAll('.method-section');
        mSections.forEach(mSec => {
            textLines.push(mSec.innerText.trim());
            textLines.push('');
        });
    });

    // 4. 結尾祝福語與社群
    const footer = reportNode.querySelector('.report-footer-box');
    if (footer) {
        textLines.push(`----------------------------------------`);
        textLines.push(`✨ 願你在每一個當下，都能活出真實的自己，感受到輕而易舉、本自具足。宇宙愛你💖`);
        textLines.push(`【凱特的社群平台】`);
        textLines.push(`YouTube: https://www.youtube.com/@katesungoodlife`);
        textLines.push(`FB: https://www.facebook.com/katesuncourse`);
        textLines.push(`IG: https://www.instagram.com/katesuncourse/`);
    }

    const fullText = textLines.join('\n');

    // 使用 Clipboard API 進行高品質複製
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullText).then(() => {
            alert('報告內容已成功複製！已自動帶入完美換行，可直接貼上至 LINE 或記事本。');
        }).catch(() => {
            fallbackCopy(fullText);
        });
    } else {
        fallbackCopy(fullText);
    }
}

// 備用複製邏輯
function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    try {
        document.execCommand('copy');
        alert('報告內容已成功複製！已自動帶入完美換行，可直接貼上至 LINE 或記事本。');
    } catch (err) {
        alert('複製失敗，請手動複製。');
    }
    document.body.removeChild(textArea);
}
